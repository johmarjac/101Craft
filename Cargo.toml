[package]
name = "craft101"
version = "0.1.0"
edition = "2021"
description = "101Craft - a hex and binary editor"

[[bin]]
name = "101Craft"
path = "src/main.rs"

[dependencies]
eframe = "0.37"
egui = "0.37"
rfd = "0.18"
image = { version = "0.25", default-features = false, features = ["png"] }
crc32fast = "1.5"
md-5 = "0.10"
sha1 = "0.10"
sha2 = "0.10"

[target.'cfg(target_os = "macos")'.dependencies]
winit = "0.30"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
codegen-units = 4

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
